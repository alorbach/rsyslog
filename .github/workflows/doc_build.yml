name: documentation build

# This workflow runs on all pull requests for validation and
# on pushes to main/master branches for deployment to GitHub Pages.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Check for doc changes
        id: doc_changes
        uses: tj-actions/changed-files@v46
        with:
          files: |
            doc/**/*.rst
        if: github.event_name == 'pull_request'

      - name: Setup Python
        if: github.event_name != 'pull_request' || steps.doc_changes.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Sphinx
        if: github.event_name != 'pull_request' || steps.doc_changes.outputs.any_changed == 'true'
        run: python -m pip install -r doc/requirements.txt

      - name: Build documentation
        if: github.event_name != 'pull_request' || steps.doc_changes.outputs.any_changed == 'true'
        run: |
          cd doc
          make html SPHINXOPTS="-W -q --keep-going"

      - name: Upload documentation artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: doc/build/html

  deploy_pages:
    needs: build_docs
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: ./html-docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./html-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
